<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0581fa">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="wrap site-header__row">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/images/favicon.png' | relative_url }}" width="28" height="28" alt="">
        <span>AnBoWork</span><span class="brand__sub">博客</span>
      </a>
      <nav class="nav" aria-label="主导航">
        {% for item in site.data.navigation %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
      <a class="btn btn--primary btn--sm" href="https://www.anbowork.com/download">下载 AnBoWork</a>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap site-footer__row">
      <p>&copy; {{ site.time | date: '%Y' }} AnBoWork. 保留所有权利。</p>
      <nav aria-label="页脚导航">
        <a href="https://www.anbowork.com">官网</a>
        <a href="https://www.anbowork.com/download">下载</a>
        <a href="https://github.com/gyabevincent-debug/anbowork">GitHub</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </div>
  </footer>
</body>
</html>
