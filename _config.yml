# 默认语言是英文(站点根目录),中文在 /zh/ 下。界面文案见 _data/i18n.yml,导航见 _data/navigation.yml。
title: "AnBoWork Blog"
description: >-
  The official AnBoWork blog: guides to the desktop AI Agent workbench, native account sign-in,
  session isolation and a stable network for AI accounts.
url: "https://gyabevincent-debug.github.io"
baseurl: ""
lang: en

author:
  name: "AnBoWork"

timezone: Asia/Shanghai
permalink: /:year/:month/:day/:title/

# feed.xml、zh/feed.xml、sitemap.xml 都是自己写的模板(要按语言拆分、带 hreflang),所以不启用 jekyll-feed / jekyll-sitemap / jekyll-seo-tag;
# <head> 里的 SEO 标签在 _includes/head-seo.html。

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - README.zh.md
  - CLAUDE.md

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
